port 26379
bind 0.0.0.0 -::1
dir /tmp

sentinel announce-ip 172.16.127.122
sentinel announce-port 26379

sentinel monitor mymaster 172.16.127.103 6379 2
sentinel auth-pass mymaster __REDIS_PASSWORD__
