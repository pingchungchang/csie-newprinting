name: Backend Tests

on:
  push:
    branches:
      - main
      - cicd
  pull_request:
    branches:
      - main

jobs:
  django-tests:
    name: Run Django and Scheduler Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: printu
          POSTGRES_PASSWORD: nasa3!Nasa3!
          POSTGRES_DB: newprinting_db
        ports:
          - 5000:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'  
      - run: |
          python -m pip install --upgrade pip
          pip install -r ubuntu/django-backend/requirements.txt
          pip install -r ubuntu/scheduler-backend/requirements.txt  
      - env:
          DB_HOST: localhost
          DB_PORT: 5000
          DB_USER: printu
          DB_PASSWORD: nasa3!Nasa3!
        run: |
          cd ubuntu/django-backend
          python manage.py test api/
