name: Backend Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  django-tests:
    name: Run Django and Scheduler Tests
    runs-on: ubuntu-latest
    
    # 建立一個測試用的 PostgreSQL 資料庫容器
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: printu
          POSTGRES_PASSWORD: password
          POSTGRES_DB: newprinting_db
        # ⭐ 關鍵修改：將容器內的 5432 Port 映射到 GitHub 虛擬機的 5000 Port
        ports:
          - 5000:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # 加入快取功能，讓之後安裝套件變快
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ubuntu/django-backend/requirements.txt
          pip install -r ubuntu/scheduler-backend/requirements.txt
          
      - name: Run Django tests
        env:
          DB_HOST: localhost
          DB_PORT: 5000 # ⭐ 關鍵修改：告訴 Django 去 5000 Port 找資料庫
          DB_USER: printu
          DB_PASSWORD: password
        run: |
          cd ubuntu/django-backend
          python manage.py test api/name: Backend Tests

