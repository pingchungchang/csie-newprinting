name: Bandit Security Scan

on:
  push:
    branches:
       - main
       - cicd
  pull_request:
    branches:
       - main

jobs:
  bandit-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install bandit
      - run: bandit -r ubuntu/ -s B101
